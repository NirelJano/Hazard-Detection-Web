<!-- Dashboard Page -->
<link rel="stylesheet" href="../css/dashboard.css">
<div class="min-h-screen safe-top safe-bottom">

    <!-- Header -->
    <header class="sticky top-0 z-40 px-5 md:px-8 py-4 flex items-center justify-between"
        style="background:rgba(15,23,42,0.9);backdrop-filter:blur(12px);">
        <h1 class="text-lg md:text-xl font-bold">Dashboard</h1>
        <button id="logout-btn" class="text-dark-400 hover:text-white transition-colors" title="Sign Out">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </button>
    </header>

    <main class="main-content-shifted px-5 md:px-8 pb-6 w-full">
        <div class="max-w-6xl mx-auto space-y-6 w-full">

            <!-- Stats Row -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 animate-fade-in">
                <div class="glass-card p-4 md:p-5 text-center">
                    <p class="text-2xl md:text-3xl font-bold text-primary-400" id="reports-count">0</p>
                    <p class="text-dark-400 text-xs md:text-sm mt-1">Reports</p>
                </div>
                <div class="glass-card p-4 md:p-5 text-center">
                    <p class="text-2xl md:text-3xl font-bold text-success" id="fixed-count">0</p>
                    <p class="text-dark-400 text-xs md:text-sm mt-1">Fixed</p>
                </div>
                <div class="glass-card p-4 md:p-5 text-center hidden md:block">
                    <p class="text-2xl md:text-3xl font-bold text-warning" id="pending-count">0</p>
                    <p class="text-dark-400 text-xs md:text-sm mt-1">In Progress</p>
                </div>
                <div class="glass-card p-4 md:p-5 text-center hidden md:block">
                    <p class="text-2xl md:text-3xl font-bold text-danger" id="new-count">0</p>
                    <p class="text-dark-400 text-xs md:text-sm mt-1">New</p>
                </div>
            </div>

            <!-- Stacked layout using custom container -->
            <div class="dashboard-container">

                <!-- Map Section -->
                <section class="dashboard-section">
                    <h2 class="text-sm font-semibold text-dark-300 mb-2">📍 Hazard Map</h2>
                    <div id="map-container"
                        class="w-full h-[300px] md:h-[400px] lg:h-[500px] rounded-xl overflow-hidden glass-card">
                        <div id="map" style="width:100%;height:100%;"></div>
                    </div>
                </section>

                <!-- Filters Section (collapsed by default) -->
                <section class="filters-section glass-card animate-fade-in" id="filters-section">
                    <!-- Toggle Button (visible on all screen sizes) -->
                    <button class="filters-toggle-btn" id="filters-toggle-btn" type="button">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                        </svg>
                        <span>Filters</span>
                        <span class="filter-active-badge hidden" id="filter-active-badge">0</span>
                        <svg class="w-4 h-4 filters-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <!-- Filter Fields -->
                    <div class="filters-panel" id="filters-panel">
                        <div class="filters-grid">
                            <!-- Hazard Type -->
                            <div class="filter-group">
                                <label class="filter-label" for="filter-hazard-type">Hazard Type</label>
                                <select id="filter-hazard-type" class="filter-input">
                                    <option value="">All Types</option>
                                </select>
                            </div>
                            <!-- Report ID -->
                            <div class="filter-group">
                                <label class="filter-label" for="filter-id">Report ID</label>
                                <input type="text" id="filter-id" class="filter-input" placeholder="e.g. 12" />
                            </div>
                            <!-- Location -->
                            <div class="filter-group">
                                <label class="filter-label" for="filter-location">Location</label>
                                <input type="text" id="filter-location" class="filter-input"
                                    placeholder="Search address..." />
                            </div>
                            <!-- Status -->
                            <div class="filter-group">
                                <label class="filter-label" for="filter-status">Status</label>
                                <select id="filter-status" class="filter-input">
                                    <option value="">All</option>
                                    <option value="new">New</option>
                                    <option value="in-progress">In Progress</option>
                                    <option value="fixed">Fixed</option>
                                </select>
                            </div>
                            <!-- Date From -->
                            <div class="filter-group">
                                <label class="filter-label" for="filter-date-from">Date From</label>
                                <input type="date" id="filter-date-from" class="filter-input" />
                            </div>
                            <!-- Date To -->
                            <div class="filter-group">
                                <label class="filter-label" for="filter-date-to">Date To</label>
                                <input type="date" id="filter-date-to" class="filter-input" />
                            </div>
                            <!-- Reported By -->
                            <div class="filter-group">
                                <label class="filter-label" for="filter-reported-by">Reported By</label>
                                <input type="text" id="filter-reported-by" class="filter-input"
                                    placeholder="Username..." />
                            </div>
                            <!-- Clear Filters -->
                            <div class="filter-group filter-group-actions">
                                <label class="filter-label">&nbsp;</label>
                                <button id="clear-filters-btn" class="filter-clear-btn" type="button">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                    Clear Filters
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Reports List -->
                <section class="dashboard-section">
                    <h2 class="text-sm font-semibold text-dark-300 mb-2">📋 Recent Reports</h2>
                    <div id="reports-list" class="space-y-3 overflow-y-auto pr-1">
                        <!-- Reports rendered dynamically -->
                        <div class="text-center py-8 text-dark-500 text-sm">Loading reports...</div>
                    </div>
                    <!-- Pagination Controls -->
                    <div id="pagination-controls" class="pagination-controls hidden">
                        <div class="pagination-info">
                            <span id="pagination-info-text">Showing 0-0 of 0</span>
                        </div>
                        <div class="pagination-buttons">
                            <button id="pagination-prev" class="pagination-btn" disabled>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 19l-7-7 7-7" />
                                </svg>
                                Previous
                            </button>
                            <span id="pagination-page-info" class="pagination-page-num">Page 1 / 1</span>
                            <button id="pagination-next" class="pagination-btn" disabled>
                                Next
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 5l7 7-7 7" />
                                </svg>
                            </button>
                        </div>
                        <div class="pagination-size">
                            <label for="page-size-select" class="pagination-size-label">Per page:</label>
                            <select id="page-size-select" class="pagination-size-select">
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>
                </section>

            </div>
        </div>

    </main>



    <!-- Bottom Navigation (mobile only) -->
    <nav class="bottom-nav md:hidden">
        <div class="flex justify-around items-center py-2 px-4">
            <a class="nav-item active" data-route="dashboard" onclick="navigateTo('dashboard')">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4" />
                </svg>
                Home
            </a>
            <a class="nav-item" data-route="upload" onclick="navigateTo('upload')">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                Upload
            </a>
            <a class="nav-item" data-route="live-detection" onclick="navigateTo('live-detection')">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Live
            </a>
            <a class="nav-item" data-route="settings" onclick="navigateTo('settings')">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Settings
            </a>
        </div>
    </nav>

    <!-- Desktop Sidebar Navigation -->
    <nav class="hidden md:flex fixed top-16 left-0 bottom-0 w-20 lg:w-56 flex-col items-center lg:items-stretch gap-1 py-6 px-2 lg:px-4 z-30"
        style="background:rgba(15,23,42,0.95);border-right:1px solid rgba(148,163,184,0.08);">
        <a class="nav-item-desktop active" data-route="dashboard" onclick="navigateTo('dashboard')">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4" />
            </svg>
            <span class="hidden lg:inline">Home</span>
        </a>
        <a class="nav-item-desktop" data-route="upload" onclick="navigateTo('upload')">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span class="hidden lg:inline">Upload</span>
        </a>
        <a class="nav-item-desktop" data-route="live-detection" onclick="navigateTo('live-detection')">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <span class="hidden lg:inline">Live Detection</span>
        </a>
        <a class="nav-item-desktop" data-route="settings" onclick="navigateTo('settings')">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="hidden lg:inline">Settings</span>
        </a>
    </nav>

    <!-- Image Modal -->
    <div id="image-modal"
        class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <button id="close-modal-btn"
            class="absolute top-4 right-4 md:top-8 md:right-8 text-white/70 hover:text-white p-2 z-50">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <img id="modal-image" src="" alt="Full size"
            class="max-w-full max-h-[90vh] rounded-lg shadow-2xl z-40 relative" />
    </div>
</div>
