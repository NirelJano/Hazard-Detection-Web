<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Road Hazard Detection - AI-powered road safety reporting" />
  <meta name="theme-color" content="#3b82f6" />

  <title>Road Hazard Detection</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
            success: '#22c55e',
            warning: '#f59e0b',
            danger: '#ef4444',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Critical CSS (inlined to avoid render-blocking) -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      background: #020617;
      color: #fff;
      min-height: 100vh;
    }

    #loading-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 3px;
    }
  </style>

  <!-- Custom Styles (non-blocking after critical CSS is inlined) -->
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- EXIF.js – loaded dynamically by upload.js when needed -->

  <!-- App Configuration -->
  <script src="/env.js"></script>
  <script type="module" src="/firebase-config.js"></script>

  <!-- Mapbox GL JS v2 – loaded dynamically by dashboard-map.js -->

</head>

<body class="bg-dark-950 text-white font-sans min-h-screen">

  <!-- App Shell - Content will be loaded here -->
  <div id="app">
    <!-- Loading Spinner -->
    <div id="loading-screen" class="min-h-screen flex flex-col items-center justify-center gap-4">
      <div class="w-12 h-12 border-4 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-dark-400 text-sm">Loading...</p>
    </div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="/js/app.js"></script>

  <!-- =====================================================
       Service Worker Registration + Auto Update
       ===================================================== -->
  <script>
    (() => {
      if (!('serviceWorker' in navigator)) return;

      // ── controllerchange: reload once the new SW takes over ────────
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('[App] New SW controller active — reloading for fresh content.');
          window.location.reload();
        }
      });

      // ── Register the SW ─────────────────────────────────────────────
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('[App] SW registered:', reg.scope);

          // Poll for updates in long-lived sessions (every 60 s)
          setInterval(() => reg.update(), 60_000);
        }).catch((err) => {
          console.warn('[App] SW registration failed:', err);
        });
      });
    })();
  </script>
</body>

</html>
