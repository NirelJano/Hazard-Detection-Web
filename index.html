<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Road Hazard Detection - AI-powered road safety reporting" />
  <meta name="theme-color" content="#3b82f6" />

  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />

  <!-- Tailwind CSS via CDN -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
            success: '#22c55e',
            warning: '#f59e0b',
            danger: '#ef4444',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Critical CSS (inlined to avoid render-blocking) -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      background: #020617;
      color: #fff;
      min-height: 100vh;
    }

    #loading-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 3px;
    }
  </style>

  <!-- Custom Styles (non-blocking after critical CSS is inlined) -->
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- EXIF.js – loaded dynamically by upload.js when needed -->

  <!-- App Configuration -->
  <script src="/env.js"></script>
  <script type="module" src="/firebase-config.js"></script>

  <!-- Mapbox GL JS v2 – loaded dynamically by dashboard-map.js -->

</head>

<body class="bg-dark-950 text-white font-sans min-h-screen">

  <!-- App Shell - Content will be loaded here -->
  <div id="app">
    <!-- Loading Spinner -->
    <div id="loading-screen" class="min-h-screen flex flex-col items-center justify-center gap-4">
      <div class="w-12 h-12 border-4 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-dark-400 text-sm">Loading...</p>
    </div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="/js/app.js"></script>

  <!-- =====================================================
       PWA Update Toast Styles
       ===================================================== -->
  <style>
    #pwa-update-toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 0.75rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.875rem;
      color: #e2e8f0;
      white-space: nowrap;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      opacity: 0;
    }

    #pwa-update-toast.show {
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
      opacity: 1;
    }

    #pwa-update-toast svg {
      flex-shrink: 0;
      color: #3b82f6;
    }

    #pwa-update-refresh {
      padding: 0.35rem 0.85rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #pwa-update-refresh:hover {
      background: #2563eb;
    }

    #pwa-update-dismiss {
      padding: 0.35rem 0.65rem;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    #pwa-update-dismiss:hover {
      color: #e2e8f0;
    }
  </style>

  <!-- PWA Update Toast HTML -->
  <div id="pwa-update-toast" role="alert" aria-live="polite">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10" />
      <polyline points="1 20 1 14 7 14" />
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
    </svg>
    <span>New version available!</span>
    <button id="pwa-update-refresh">Refresh</button>
    <button id="pwa-update-dismiss" aria-label="Dismiss">✕</button>
  </div>

  <!-- =====================================================
       Service Worker Registration + Update Detection
       ===================================================== -->
  <script>
    (() => {
      if (!('serviceWorker' in navigator)) return;

      let newWorker = null; // reference to the SW waiting to activate

      // ── 1. Show / hide the toast ──────────────────────────────────────
      function showUpdateToast() {
        const toast = document.getElementById('pwa-update-toast');
        if (toast) toast.classList.add('show');
      }
      function hideUpdateToast() {
        const toast = document.getElementById('pwa-update-toast');
        if (toast) toast.classList.remove('show');
      }

      // ── 2. "Refresh" button: tell the waiting SW to skip waiting ──────
      document.getElementById('pwa-update-refresh').addEventListener('click', () => {
        if (newWorker) {
          // This message triggers self.skipWaiting() inside sw.js
          newWorker.postMessage({ type: 'SKIP_WAITING' });
        }
        hideUpdateToast();
      });

      // ── 3. "Dismiss" button: close toast without updating ─────────────
      document.getElementById('pwa-update-dismiss').addEventListener('click', hideUpdateToast);

      // ── 4. controllerchange: reload once the new SW takes over ────────
      // This fires after skipWaiting() completes and the new SW claims all clients.
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        console.log('[App] New SW controller active — reloading for fresh content.');
        window.location.reload();
      });

      // ── 5. Register the SW and watch for updates ──────────────────────
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('[App] SW registered:', reg.scope);

          // Helper that wires update detection to an SW registration object
          function trackUpdate(registration) {
            // An SW is already waiting (e.g. page was refreshed while an update was pending)
            if (registration.waiting) {
              newWorker = registration.waiting;
              showUpdateToast();
              return;
            }

            // Watch for an update that is currently installing
            registration.addEventListener('updatefound', () => {
              const installing = registration.installing;
              if (!installing) return;

              installing.addEventListener('statechange', () => {
                if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                  // A new SW is installed and waiting — existing SW still controls the page
                  console.log('[App] New SW installed and waiting.');
                  newWorker = installing;
                  showUpdateToast();
                }
              });
            });
          }

          trackUpdate(reg);

          // Also poll for updates in long-lived sessions (every 60 s)
          setInterval(() => reg.update(), 60_000);

        }).catch((err) => {
          console.warn('[App] SW registration failed:', err);
        });
      });
    })();
  </script>
</body>

</html>
